<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live STT — Speech to Text en temps réel</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 780px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    .sub { color: #888; margin-top: 0; }
    .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
    button {
      padding: 0.6rem 1.1rem; font-size: 1rem; border-radius: 8px;
      border: 1px solid #888; cursor: pointer; background: transparent;
    }
    button.primary { background: #d33; color: white; border-color: #d33; }
    button.primary.recording { background: #555; border-color: #555; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    select { padding: 0.5rem; border-radius: 8px; }
    #status { font-size: 0.9rem; color: #888; }
    #transcript {
      min-height: 240px; padding: 1rem; border: 1px solid #888; border-radius: 8px;
      white-space: pre-wrap; word-wrap: break-word; font-size: 1.05rem;
    }
    .partial { color: #888; font-style: italic; }
    .level {
      width: 100px; height: 8px; background: #2222; border-radius: 4px; overflow: hidden;
    }
    .level > div { height: 100%; width: 0%; background: #4a4; transition: width 0.05s; }
  </style>
</head>
<body>
  <h1>Live STT</h1>
  <p class="sub">Transcription vocale en temps réel (sherpa-onnx, zipformer streaming FR).</p>

  <div class="controls">
    <button id="toggle" class="primary">Démarrer</button>
    <div class="level"><div id="level"></div></div>
    <span id="status">Prêt.</span>
  </div>

  <div id="transcript"></div>

  <script src="/static/app.js"></script>
</body>
</html>
